<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Your sign-in link</title>
</head>
<body style="margin:0;padding:0;background-color:#0F0D0B;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0F0D0B" style="background-color:#0F0D0B;">
    <tr><td align="center" style="padding:0;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;">
        <tr>
          <td bgcolor="#0F0D0B" style="background-color:#0F0D0B;padding:32px 32px 28px;">
            <img src="https://www.oneflamerecords.com/brand/email/horizontal-light.png" alt="One Flame Records" width="200" style="display:block;width:200px;max-width:100%;height:auto;border:0;outline:none;">
          </td>
        </tr>
        <tr><td height="4" bgcolor="#F2C230" style="height:4px;line-height:4px;font-size:0;background-color:#F2C230;">&nbsp;</td></tr>
        <tr>
          <td bgcolor="#FFF7E6" style="background-color:#FFF7E6;padding:40px 32px 44px;font-family:Archivo,Arial,Helvetica,sans-serif;color:#0F0D0B;">
          <h1 style="margin:0;font-family:'Big Shoulders Display',Impact,'Arial Narrow Bold',sans-serif;font-size:38px;line-height:40px;font-weight:900;text-transform:uppercase;letter-spacing:0.01em;color:#0F0D0B;">Your sign-in link</h1>
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="72" style="margin:14px 0 24px;">
            <tr><td height="6" bgcolor="#C8321F" style="height:6px;line-height:6px;font-size:0;background-color:#C8321F;">&nbsp;</td></tr>
          </table>
          <p style="margin:0 0 0;font-family:Archivo,Arial,Helvetica,sans-serif;font-size:17px;line-height:1.6;color:#0F0D0B;">Follow the link below to sign in. This link expires shortly.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0 0;">
    <tr>
      <td align="center" bgcolor="#F2C230" style="background-color:#F2C230;border:2px solid #0F0D0B;">
        <a href="{{ .ConfirmationURL }}" style="display:block;padding:15px 28px;font-family:Archivo,Arial,Helvetica,sans-serif;font-size:15px;line-height:15px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;text-decoration:none;color:#0F0D0B;">Sign in</a>
      </td>
    </tr>
  </table>
<p style="margin:28px 0 0;font-family:Archivo,Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;color:#0F0D0B;">If you didn't ask for this, you can ignore this email.</p>
          </td>
        </tr>
        <tr>
          <td bgcolor="#0F0D0B" style="background-color:#0F0D0B;padding:24px 32px 32px;font-family:Archivo,Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:#D8CCB4;">
            One Flame Records &middot; Montego Bay, Jamaica
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
