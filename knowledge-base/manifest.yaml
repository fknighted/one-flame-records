files:
  - slug: 00-overview
    title: One Flame Records overview
    audience: customer
    confidence: verified
    intent:
      - overview
      - about
      - orientation
    summary: One Flame Records is an independent reggae and dancehall label based in Montego Bay,
      Jamaica. The label records, releases and represents Jamaican artists, and it also runs Flames
      Lounge, a creative space in Montego Bay with an outdoor recording studio, gaming, food and
      live events. On the website you can browse the roster, watch videos, read label news, learn
      about Flames Lounge, and get in touch about signing, press or licensing.
  - slug: accounts-and-access
    title: Accounts, login and access
    audience: customer
    confidence: verified
    intent:
      - accounts
      - login
      - access
      - roles
    summary: Most of the One Flame Records website is open to everyone with no account at all. Artist
      applications require label approval. Label and Lounge staff access is assigned by the label.
      There are no gaming accounts. If you have an account you sign in from the login page with your
      email address and password, and there is a "forgot password" link there if you need a reset
      link sent to you.
  - slug: artist-portal
    title: Artist portal and saved videos
    audience: customer
    confidence: verified
    intent:
      - accounts
      - artists
      - portal
      - video
    summary: Artist accounts have a private dashboard, releases, assets, profile and saved-video
      library. You can watch completed saved videos and manage their visibility. New automatic video
      requests and the old AI Studio were retired in October 2026.
  - slug: artists-and-roster
    title: Artists and roster
    audience: customer
    confidence: verified
    intent:
      - catalog
      - artists
      - roster
    summary: "As of the eleventh of August 2026, nine artists appear on the public roster: Bawlinz, Fola
      Boss, Kahlic, Layd D, Layshaunex, Mystique Fyre, Phayroh, Twiggy, and Vyperxstudiobeat. Each
      has a page on the site showing their hometown, genres, and any videos or music the label has
      made public. The roster page is the definitive list, so check it rather than quoting this one
      if the count matters."
  - slug: brand-and-voice
    title: Brand and voice
    audience: internal
    confidence: verified
    intent:
      - brand
      - voice
      - tone
      - style
    summary: "Speak the way the label writes: confident, grounded and specific. Short sentences, active
      verbs, real details instead of vague enthusiasm. The label's own guidance is that copy should
      read like a dance-poster flyer or the back of a record sleeve, not a tourism advert. Never
      perform Jamaican-ness for effect."
  - slug: contact-and-support
    title: Contact and support
    audience: customer
    confidence: verified
    intent:
      - contact
      - support
      - newsletter
    summary: The main way to reach One Flame Records is the contact form on the website's Contact page.
      It asks for your name, your email address, a reason for writing, and your message. For
      privacy, data and newsletter matters the label publishes the email address contact at
      oneflamerecords dot com. No phone number is published.
  - slug: escalation-and-limits
    title: Escalation and limits
    audience: internal
    confidence: verified
    intent:
      - guardrails
      - escalation
      - limits
    summary: The assistant answers questions about the label, the roster, Flames Lounge and how to get
      in touch. It hands over to a human the moment a question touches money, contracts, legal
      matters, a named individual's account, or any fact the website does not publish. When in
      doubt, say what is known, say plainly what is not, and point to the contact form.
  - slug: faq
    title: Frequently asked questions
    audience: customer
    confidence: verified
    intent:
      - faq
      - overview
      - support
    summary: "The questions people most often ask One Flame Records are how to get signed, where to find
      the music, what Flames Lounge is, and how to get in touch. Short answers: send links through
      the contact form, browse the Artists and Videos pages, the Lounge is the label's creative
      space in Montego Bay with a studio, gaming, food and events, and the contact form is the way
      to reach the team."
  - slug: flames-lounge
    title: Flames Lounge
    audience: customer
    confidence: verified
    intent:
      - venue
      - lounge
      - food
      - events
      - studio
    summary: Flames Lounge is One Flame Records' creative and social space in Montego Bay, Jamaica. It
      has an outdoor recording studio, a gaming lounge, freshly made Jamaican food and drinks, and a
      programme of live events. Walk-ins are welcome and no reservation is needed. Opening hours are
      not published on the website yet, so please check with the Lounge directly before travelling.
  - slug: gaming-at-flames-lounge
    title: Gaming at Flames Lounge
    audience: customer
    confidence: verified
    intent:
      - gaming
      - game time
      - walk-in
      - session rates
    summary: Gaming at Flames Lounge is walk-in only. Ask at the Lounge counter and staff will start a
      timed session for you. There are no gaming accounts, memberships, stored balances or online
      booking, and none have been offered since 9 October 2026.
  - slug: glossary
    title: Glossary
    audience: internal
    confidence: verified
    intent:
      - glossary
      - vocabulary
      - terminology
    summary: These are the words visitors and staff use around One Flame Records. Recognise them when
      someone says them aloud, especially the venue name, the artist names, and the music terms — a
      voice agent will hear them spoken far more often than it will read them.
  - slug: policies
    title: Privacy, terms and data
    audience: customer
    confidence: verified
    intent:
      - policy
      - legal
      - privacy
      - terms
    summary: The October2026 Privacy Policy covers supplied information, essential sign-in cookies,
      limited website diagnostics and external media embeds; Terms remain dated June2026.
      Newsletter consent requires email confirmation. Contact contact at oneflamerecords dot com
      for privacy requests; no new privacy or legal guarantees are inferred.
  - slug: pricing-and-payments
    title: Pricing and payments
    audience: customer
    confidence: verified
    intent:
      - pricing
      - billing
      - payments
    summary: Nothing on the One Flame Records website is paid for online. There is no shop, no checkout
      and no card payment on the site — browsing, subscribing to the newsletter and submitting music
      are free. Gaming needs no account. Anything you buy at Flames Lounge — food, drinks or gaming
      time — is paid for in person at the venue.
  - slug: releases-and-videos
    title: Finding releases, videos and news
    audience: customer
    confidence: verified
    intent:
      - catalog
      - releases
      - videos
      - music
      - news
    summary: Use Releases for the current discography, Videos for published clips, and News for label
      announcements. These pages change as the label publishes. Historical counts and old
      screenshots do not establish today’s catalogue or next release date.
  - slug: signing-and-submissions
    title: Signing and artist submissions
    audience: customer
    confidence: verified
    intent:
      - signing
      - submissions
      - demo
      - artists
    summary: Send a message through the contact page on the website, choosing "Artist submission" as the
      reason, and include a short bio, a description of your sound, and links to your best work. No
      attachments are needed at that stage. The label says every submission is listened to by the
      team and that they aim to get back to you within two weeks. If the music fits, the next step
      is a call — not paperwork.
  - slug: troubleshooting
    title: Troubleshooting
    audience: customer
    confidence: verified
    intent:
      - support
      - troubleshooting
      - errors
    summary: "Most problems on the One Flame Records site fall into three groups: a page that cannot be
      found, an email that never arrived, or a form that refuses to send. Each has a simple first
      step — reload from the main navigation, check your spam folder, or check the required fields.
      If none of that works, use the contact form and a person will pick it up."
